Import: 
  - config-local.yaml
  # - config-resources-directly.yaml

Host: ${APP_HOST:-localhost}
Port: ${APP_PORT:-8092}

# This app's own cartridge identity, reported to the lobby in every
# /nomenclature response - several nodes sharing the same CartridgeSlug
# are several nodes of the same cartridge (for load-balancing), not
# several different cartridges.
CartridgeSlug: lxGames

# Where this app looks for its own installed games - one subdirectory per
# game, each with its own lx-game.yaml (nomenclature.Holder.Load scans it
# at startup; see app/app.go's NewApp).
GamesDir: runtime/plugins

# Both optional - which of the found games actually get published, by
# slug. GamesIgnore skips the listed slugs; GamesAllow, if set, is the
# *only* slugs reported, everything else found is skipped. GamesIgnore
# wins if a slug is listed in both. A slug that doesn't match any
# actually-found game is simply never matched, not an error.
# GamesIgnore: []
# GamesAllow: []

# The externally-reachable base URL this cartridge's own static assets
# (images/css/js, see Components.JSPreprocessor.AssetLinksPath) are served
# at - a CDN, or (the simplest case, and the default below) this same
# app's own origin.
Params:
  StaticSrc: ${STATIC_SRC:-http://localhost:8092}

# The lobby itself - used to announce this app's startup (once, and
# re-broadcast as a deregister on graceful shutdown over the WS connection
# the lobby then establishes back), and for whatever other lobby endpoints
# this app calls later - the specific path for each is this app's own
# business, appended in code (see cartridgeAnnouncePath in
# app/cartridge_setup.go), not part of this value. Empty/absent just means
# "no lobby configured" - this app stays fully usable standalone either way.
LobbyURL: ${LOBBY_URL:-http://localhost:8090}

# The full addr announced to the lobby, when it needs to differ from
# this app's own "localhost:Port" (see advertiseAddr in
# app/cartridge_setup.go) - e.g. behind Docker's port publishing, where
# the internally-listening port isn't necessarily the one actually
# reachable from outside. Empty/absent means "use localhost:Port as the
# announced address too" - the case for a plain, directly-reachable run.
CartridgeAdvertiseAddr: ${CARTRIDGE_ADVERTISE_ADDR:-}

Components:
  JSPreprocessor:
    CorePath: runtime/web/build/core.js
    MapsPath: runtime/jspp
    ModsPath: runtime/jspp/mods
    PluginsPath: runtime/jspp/plugins
    AssetLinksPath:
      Inner: runtime/web/assets
      Outer: /web
    AppConfig: runtime/lx-app.yaml

  # Lets this cartridge's own static asset routes (see InitRoutes'
  # RegisterFileAssets/EnableFor calls) be fetched cross-origin from the
  # lobby's page - needed only when AssetLinksPath.Outer is configured
  # absolute so the browser actually loads this cartridge's assets directly.
  # Cors:
  #   Origins:
  #     "http://localhost:8000": {}
