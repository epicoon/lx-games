name: OotvPlugin

# --- Common ---
images:
  default: assets/images
i18n: assets/i18n/main.yaml
require:
  - assets/css/
cssAssets:
  - lxGames.ootv.MainCss

cacheType: inherit


# --- Server ---
server:
  rootSnippet: snippets/_root.js
  snippets:
    - snippets

# aliases:
#   data: '{plugin:OotvPlugin}/data'

# --- Client ---
client:
  file: client/Plugin.js
  require:
    - client/guiNodes/

  guiNodes:
    main: lxGames.ootv.gui.Main
    newGameMenu: lxGames.ootv.gui.NewGameMenu
    statusIcon: lxGames.ootv.gui.StatusIcon
    floatHint: lxGames.ootv.gui.FloatHint
    pileContent: lxGames.ootv.gui.PileContent
    floatPoints: lxGames.ootv.gui.FloatPoints
    dataStorageMenu: lxGames.ootv.gui.DataStorageMenu
    scoreTable: lxGames.ootv.gui.ScoreTable
    rules: lxGames.ootv.gui.Rules
