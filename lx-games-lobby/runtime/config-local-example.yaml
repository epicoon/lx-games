# The lobby only ever dials OUT to these cartridges - a cartridge announces
# itself via POST /cartridge/announce, but the lobby is what actually
# establishes the WS connection back, and only to a host:port already
# listed here.
RegistrySettings:
  RequestTimeoutMs: 3000
  RetryIntervalMs: 5000
  MaxRetries: 5

# Every cartridge this lobby is allowed to dial, as "host:port" - a real,
# externally reachable address for wherever that cartridge actually runs
# (a different server, a different Docker host, anything). Add or remove
# entries directly in this file to change the set.
Cartridges:
  - localhost:8100

Components:
  WSServer:
    MaxRequestsPerMinute: 10
    MaxConnectionsPerIp: 5
    ReconnectionAllowed: false
    ReconnectionDuration: 5000
    LifecycleLog: true
    LifecycleError: true
  JSPreprocessor:
    Mode: DEV
    PluginCacheType: dev
  # ID/Secret come from registering this lobby as an OAuth client on the
  # lxgo-auth instance it authenticates against (`client:new`) - per
  # machine, since each developer's lxgo-auth instance knows its own
  # clients. RedirectUri isn't actually dialed by this integration (no
  # browser redirect - see lxgo-auth's README, "no-redirect" flow) but
  # still has to match exactly what was registered.
  Auth:
    ID: 0
    Secret: ""
    RedirectUri: http://localhost:8090/auth-callback
    Server: http://localhost:8080
