  # Common
  floatHint.0: "<b>Data Storage:</b> change the dice value by +1 or -1 at any time during your turn. Important: 6 + 1 will give 1, 1 - 1 will give 6"
  floatHint.1: "<b>Energy Credit:</b> you can buy a token from the central storage for two energy credits"
  floatHint.2: "<b>Player token:</b> shows the current number of earned points"
  floatHint.3: "<b>Player token:</b> shows the order in which players take turns during a round - the farther to the right (or higher), the earlier"
  floatHint.4: "<b>Shared dice:</b> at the beginning of the round determines which numbered storage the minerals will be sent to"
  floatHint.5: "<b>Player dice:</b> use it to take tokens from the common field, add tokens to your building zone, split minerals, or exchange the dice for two Data Storage units"
  floatHint.6: "<b>Stage minerals:</b> will be revealed in their stage"
  floatHint.7: "<b>Turn minerals:</b> will be determined by the dice (sent to the numbered storage) at the beginning of their turn"
  floatHint.8: "<b>Storage minerals:</b> can be taken away by a player when adding the mining probe to their building zone"
  floatHint.9: "<b>Player minerals:</b> can be split, each will give --?-- victory points. A split group of minerals will give an energy credit"
  floatHint.10: "<b>Split minerals:</b> can only score points if the corresponding technology is present"
  floatHint.11: "<b>Mining Probe:</b> allows you to take minerals from any storage to your board and move your token to the right on the turn order track"
  floatHint.12: "<b>Drones:</b> give --?-- victory points. If you have drones of the same type in the cluster, they will earn points again"
  floatHint.13: "<b>Command Station:</b> gives an immediate additional action"
  floatHint.14: "<b>Solar Panels:</b> at the end of each phase it gives an energy credit"
  # Modules
  floatHint.15: "<b>Drone Manufacturing Plant:</b> allows you to immediately take a mining probe or drone from any numbered storage"
  floatHint.16: "<b>Research Laboratory:</b> allows you to immediately take solar panels, a command station, or technology from any numbered storage"
  floatHint.17: "<b>Supercomputer:</b> provides four Data Storage units"
  floatHint.18: "<b>Assembly Module:</b> allows you to immediately take a module from any numbered storage"
  floatHint.19: "<b>Tokamak:</b> provides two energy credits"
  floatHint.20: "<b>Roboport:</b> allows the player to add any hexagonal token from their board to their building zone"
  floatHint.21: "<b>Matter Splitter:</b> allows you to immediately split any type of minerals"
  floatHint.22: "<b>Telescope:</b> gives 4 victory points"
  # Bonus
  floatHint.23: "<b>Gold Medal:</b> to receive a bonus, fill all cells of the corresponding color in your building zone first"
  floatHint.24: "<b>Silver Medal:</b> a bonus for filling all cells of the corresponding color in your building zone second"
  # Technology
  floatHint.25: "<b>Technology:</b> allows you to ignore the rule that there cannot be more than 1 module of the same type in one cluster"
  floatHint.26: "<b>Technology:</b> at the end of a phase, each solar panel provides an additional Data Storage unit in addition to an energy credit"
  floatHint.27: "<b>Technology:</b> splitting minerals gives not one, but two energy credits"
  floatHint.28: "<b>Technology:</b> splitting minerals provides an additional Data Storage unit in addition to an energy credit"
  floatHint.29: "<b>Technology:</b> when adding a mining probe to your building zone, you can take minerals from two ADJACENT numbered storages"
  floatHint.30: "<b>Technology:</b> allows you to buy tokens from the numbered storages for energy credits"
  floatHint.31: "<b>Technology:</b> when adding a drone token to your building zone, it gives 1 additional victory point for each drone token of the same type in the cluster"
  floatHint.32: "<b>Technology:</b> allows you to change the dice value by +2 or -2 by spending a Data Storage unit"
  floatHint.33: "<b>Technology:</b> when adding a module token to your building zone, the dice value is considered +1 or -1 as if a Data Storage unit had been spent"
  floatHint.34: "<b>Technology:</b> when adding a mining probe or drones token to your building zone, the dice value is considered +1 or -1 as if a Data Storage unit had been spent"
  floatHint.35: "<b>Technology:</b> when adding solar panels, technology, or a command station token to your building zone, the dice value is considered +1 or -1 as if a Data Storage unit had been spent"
  floatHint.36: "<b>Technology:</b> when taking a token from a numbered storage, the dice value is considered +1 or -1 as if a Data Storage unit had been spent"
  floatHint.37: "<b>Technology:</b> allows you to exchange the dice for an energy credit (in addition to two Data Storage units)"
  floatHint.38: "<b>Technology:</b> allows you to exchange the dice for four Data Storage units"
  floatHint.39: "<b>Technology:</b> at the end of the game, it will give 3 victory points for each type of split minerals"
  floatHint.40: "<b>Technology:</b> at the end of the game, it will give 4 victory points for each built matter splitter"
  floatHint.41: "<b>Technology:</b> at the end of the game, it will give 4 victory points for each built telescope"
  floatHint.42: "<b>Technology:</b> at the end of the game, it will give 4 victory points for each built assembly module"
  floatHint.43: "<b>Technology:</b> at the end of the game, it will give 4 victory points for each built research laboratory"
  floatHint.44: "<b>Technology:</b> at the end of the game, it will give 4 victory points for each built drone manufacturing plant"
  floatHint.45: "<b>Technology:</b> at the end of the game, it will give 4 victory points for each built supercomputer"
  floatHint.46: "<b>Technology:</b> at the end of the game, it will give 4 victory points for each built tokamak"
  floatHint.47: "<b>Technology:</b> at the end of the game, it will give 4 victory points for each built roboport"
  floatHint.48: "<b>Technology:</b> at the end of the game, it will give 4 victory points for each type of placed drone"
  floatHint.49: "<b>Technology:</b> at the end of the game, it will give 1 victory point for each split minerals token"
  floatHint.50: "<b>Technology:</b> at the end of the game, it will give 2 victory points for each bonus token"

