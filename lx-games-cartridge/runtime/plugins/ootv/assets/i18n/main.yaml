  # Drones
  drone.title: Дроны
  drone.service: Обслуживающие дроны
  drone.scout: Дроны разведки
  drone.cargo: Транспортные дроны
  drone.support: Дроны поддержки

  # Common
  floatHint.0: "<b>Накопитель данных:</b> в любой момент своего хода изменяйте результат кубика на +1 или -1. Важно: 6 + 1 даст 1, 1 - 1 даст 6"
  floatHint.1: "<b>Энергокредит:</b> за два энергокредита можно купить жетон в центральном хранилище"
  floatHint.2: "<b>Фишка игрока:</b> показывают текущее количество заработанных очков"
  floatHint.3: "<b>Фишка игрока:</b> показывают в каком порядке игроки ходят в течение раунда - чем правее (или выше) фишка, тем раньше"
  floatHint.4: "<b>Общий кубик:</b> в начале раунда разыгрывает в какое пронумерованное хранилище отправится минерал"
  floatHint.5: "<b>Кубик игрока:</b> с его помощью берите жетоны с общего поля, добавляйте жетоны в свою зону строительства, расщепляйте минералы, или обменяйте кубик на два накопителя данных"
  floatHint.6: "<b>Минералы стадии:</b> будут открыты в свою стадию"
  floatHint.7: "<b>Минерал раунда:</b> будет разыгран кубиком (отправится в пронумерованное хранилище) в начале своего раунда"
  floatHint.8: "<b>Минерал в хранилище:</b> может быть забран игроком при добавлении в зону строительства добывающего зонда"
  floatHint.9: "<b>Минерал у игрока:</b> может быть расщеплён, каждый даст по --?-- победных очка. Расщеплённая группа минералов даст энергокредит"
  floatHint.10: "<b>Минерал расщеплённый:</b> может дать очки только при наличии подходящих технологий"
  floatHint.11: "<b>Добывающий зонд:</b> позволит забрать минералы из любого хранилища на ваш планшет и сместит вашу фишку вправо по треку очередности хода"
  floatHint.12: "<b>Дроны:</b> дает --?-- победных очка. При наличии в кластере дронов этого же типа, они повторно приносят очки"
  floatHint.13: "<b>Командная станция:</b> дает немедленное дополнительное действие"
  floatHint.14: "<b>Солнечные панели:</b> в конце каждой фазы приносят энергокредит"
  # Modules
  floatHint.15: "<b>Дроновый завод:</b> позволит немедленно забрать добывающий зонд или дрон с любого пронумерованного хранилища"
  floatHint.16: "<b>Исследовательская лаборатория:</b> позволит немедленно забрать солнечные панели, командную станцию или технологию с любого пронумерованного хранилища"
  floatHint.17: "<b>Суперкомпьютер:</b> даст четыре накопителя данных"
  floatHint.18: "<b>Сборочный модуль:</b> позволит немедленно забрать модуль с любого пронумерованного хранилища"
  floatHint.19: "<b>Токамак:</b> даст два энергокредита"
  floatHint.20: "<b>Робопорт:</b> позволит игроку добавить со своего планшета в зону строительства любой шестиугольный жетон"
  floatHint.21: "<b>Расщепитель материи:</b> позволит немедленно расщепить один любой тип минералов"
  floatHint.22: "<b>Телескоп:</b> даст 4 победных очка"
  # Bonus
  floatHint.23: "<b>Золотая медаль:</b> чтобы получить бонус, заполните в своей зоне строительства все ячейки соответствующего цвета первым"
  floatHint.24: "<b>Серебряная медаль:</b> бонус тому, кто заполнит в своей зоне строительства все ячейки соответствующего цвета вторым"
  # Technology
  floatHint.25: "<b>Технология:</b> позволяет игнорировать правило о том, что в одном кластере не может быть больше 1 модуля одного типа"
  floatHint.26: "<b>Технология:</b> в конце фазы каждая солнечная панель дает помимо энергокредита еще один накопитель данных"
  floatHint.27: "<b>Технология:</b> расщепление минералов даст не один, а два энергокредита"
  floatHint.28: "<b>Технология:</b> расщепление минералов даст помимо энергокредита еще один накопитель данных"
  floatHint.29: "<b>Технология:</b> при добавлении в зону строительства добывающего зонда можно забрать минералы из двух СОСЕДНИХ пронумерованных хранилищ"
  floatHint.30: "<b>Технология:</b> позволяет покупать за энергокредиты жетоны из пронумерованных хранилищ"
  floatHint.31: "<b>Технология:</b> при добавлении в зону строительства жетона дрона дает на 1 победное очко больше за каждый жетон дрона этого типа в кластере"
  floatHint.32: "<b>Технология:</b> позволяет изменять результат кубика на +2, -2 за потраченный накопитель данных"
  floatHint.33: "<b>Технология:</b> при добавлении в зону строительства модуля, значение кубика считается +1, -1, как если бы был потрачен накопитель данных"
  floatHint.34: "<b>Технология:</b> при добавлении в зону строительства добывающего зонда или дрона, значение кубика считается +1, -1, как если бы был потрачен накопитель данных"
  floatHint.35: "<b>Технология:</b> при добавлении в зону строительства солнечных панелей, технологии или командной станции, значение кубика считается +1, -1, как если бы был потрачен накопитель данных"
  floatHint.36: "<b>Технология:</b> при взятии жетона из пронумерованного хранилища, значение кубика считается +1, -1, как если бы был потрачен накопитель данных"
  floatHint.37: "<b>Технология:</b> позволяет обменивать кубик на энергокредит (в дополнение к двум накопителям данных)"
  floatHint.38: "<b>Технология:</b> позволяет обменивать кубик на четыре накопителя данных"
  floatHint.39: "<b>Технология:</b> в конце игры принесет по 3 победных очка за каждый тип расщеплённых минералов"
  floatHint.40: "<b>Технология:</b> в конце игры принесет по 4 победных очка за каждый построенный расщепитель материи"
  floatHint.41: "<b>Технология:</b> в конце игры принесет по 4 победных очка за каждый построенный телескоп"
  floatHint.42: "<b>Технология:</b> в конце игры принесет по 4 победных очка за каждый построенный сборочный модуль"
  floatHint.43: "<b>Технология:</b> в конце игры принесет по 4 победных очка за каждую построенную исследовательскую лабораторию"
  floatHint.44: "<b>Технология:</b> в конце игры принесет по 4 победных очка за каждый построенный дроновый завод"
  floatHint.45: "<b>Технология:</b> в конце игры принесет по 4 победных очка за каждый построенный суперкомпьютер"
  floatHint.46: "<b>Технология:</b> в конце игры принесет по 4 победных очка за каждый построенный токамак"
  floatHint.47: "<b>Технология:</b> в конце игры принесет по 4 победных очка за каждый построенный робопорт"
  floatHint.48: "<b>Технология:</b> в конце игры принесет по 4 победных очка за каждый тип размещенных дронов"
  floatHint.49: "<b>Технология:</b> в конце игры принесет 1 победное очко за каждый жетон расщеплённого минерала"
  floatHint.50: "<b>Технология:</b> в конце игры принесет по 2 победных очка за каждый жетон бонуса"

