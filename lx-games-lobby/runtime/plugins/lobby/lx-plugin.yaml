name: LobbyPlugin

# --- Common ---
images:
  default: assets/images
i18n: assets/i18n/main.yaml
require:
  - assets/css/
cssAssets:
  - lxGames.lobby.MainCss

cacheType: inherit


# --- Server ---
server:
  key: lobby.LobbyPlugin
  rootSnippet: snippets/_root.js
  snippets:
    - snippets

# --- Client ---
client:
  file: Plugin.js
  require:
    - client/Core.js
    - client/guiHelpers/
    - client/guiNodes/

  core: lxGames.lobby.Core

  guiNodes:
    main: lxGames.lobby.GuiMain
    topbar: lxGames.lobby.GuiTopbar
    rail: lxGames.lobby.GuiRail
    center: lxGames.lobby.GuiCenter
    detail: lxGames.lobby.GuiDetail
