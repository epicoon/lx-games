Import: [config-local.yaml]

Host: ${APP_HOST:-localhost}
Port: ${APP_PORT:-8000}

# Forwarded to the browser via lx-app.yaml's params (@config(...)) - the
# browser's own WS client needs an explicit port because it never
# inherits the current page's port implicitly (see Core.js); Port itself
# isn't necessarily what's reachable from outside (see runtime/.env's
# APP_PORT_EXTERNAL, for Docker's port mapping).
Params:
  AppPortExternal: ${APP_PORT_EXTERNAL:-8000}

Templates:
  - Dir: runtime/templates
    Layout: layout

Components:
  SessionStorage:
    CookieName: lxlobbysessionid
    MaxLifeTime: 3600
  Auth:
    StateUri: /auth-state
    ExchangeUri: /auth-exchange
    LogoutUri: /logout
    RefreshUri: /auth-refresh
    UserDataUri: /get-user
  WSServer:
    DefaultChannel:
      Key: lobby
      SharedData:
        Name: lobby
  JSPreprocessor:
    CorePath: runtime/web/build/core.js
    MapsPath: runtime/jspp
    ModsPath: runtime/jspp/mods
    PluginsPath: runtime/jspp/plugins
    AssetLinksPath:
      Inner: runtime/web/assets
      Outer: /web
    AppConfig: runtime/lx-app.yaml
